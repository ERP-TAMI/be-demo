name: Deploy BE

on:
  push:
    branches:
      - prod

jobs:
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy on server
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Pull image mới nhất
        run: docker pull ${{ secrets.DOCKERHUB_IMAGE }}:latest

      - name: Restart BE container
        run: |
          docker stop erp_be 2>/dev/null && docker rm erp_be 2>/dev/null || true
          docker run -d \
            --name erp_be \
            --network host \
            --restart unless-stopped \
            --env-file $HOME/erp/.env \
            ${{ secrets.DOCKERHUB_IMAGE }}:latest

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health; then
              echo "✅ BE đang chạy"
              exit 0
            fi
            echo "Đang chờ... ($i/20)"
            sleep 3
          done
          echo "❌ BE không phản hồi sau 60 giây"
          exit 1
