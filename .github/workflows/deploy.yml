name: Deploy BE

on:
  push:
    branches:
      - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/erp-be

jobs:
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy on server
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Pull image mới nhất
        run: docker pull ghcr.io/${{ github.repository_owner }}/erp-be:latest

      - name: Restart BE container
        run: |
          docker stop erp_be 2>/dev/null && docker rm erp_be 2>/dev/null || true
          docker run -d \
            --name erp_be \
            --network host \
            --restart unless-stopped \
            --env-file $HOME/erp/.env \
            -e DB_HOST=localhost \
            -e MINIO_ENDPOINT=localhost \
            ghcr.io/${{ github.repository_owner }}/erp-be:latest

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health; then
              echo "✅ BE đang chạy"
              exit 0
            fi
            echo "Đang chờ... ($i/20)"
            sleep 3
          done
          echo "❌ BE không phản hồi sau 60 giây"
          exit 1
